[project]
name = "profibus-mock-slave"
version = "0.1.0"
description = "Mock PROFIBUS DP slaves behind a TCP JSON-lines protocol, for local testing of profibus-mcp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents" }]
dependencies = [
    "rich>=13.7.0",
]

[project.scripts]
profibus-mock-slave = "profibus_mock_slave:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
