name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything here runs without PROFIBUS hardware. The server's integration
# tests start profibus-mock-slave on a free local port and drive the real
# server over stdio with the MCP client SDK (PROFIBUS_BACKEND=mock). No serial
# port is ever opened.
jobs:
  pyprofibus:
    name: Actual pyprofibus DP stack (dummy PHY only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install isolated pinned upstream runtime
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/pyprofibus"
          PYPROFIBUS_CYTHON_BUILD=0 uv pip install --python "$RUNNER_TEMP/pyprofibus" pyserial==3.5 \
            'pyprofibus @ git+https://github.com/mbuesch/pyprofibus.git@7b6fa3cea6edb162f5cc56c8afe6eae6e0ccda32'
      - name: Real state machine, MCP wire and worker lifecycle
        run: |
          PROFIBUS_TEST_PYTHON="$RUNNER_TEMP/pyprofibus/bin/python" uv run --locked --directory profibus-python \
            pytest -v tests/test_pyprofibus_integration.py tests/test_pyprofibus_backend.py
  server:
    name: MCP server (profibus-python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: profibus-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      # Unit tests plus the end-to-end stdio tests against the mock slave
      # (tests/test_integration_stdio.py starts it with `uv run`).
      - name: Tests
        run: uv run --no-sync pytest -v

      # Every floor in pyproject.toml must be one the tests pass on: install
      # the lowest allowed version of each direct dependency into a separate
      # environment and run the whole suite again.
      - name: Tests with the lowest direct dependencies
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest" --resolution lowest-direct -e . --group dev
          uv pip list --python "$RUNNER_TEMP/lowest"
          "$RUNNER_TEMP/lowest/bin/python" -m pytest -q

  mock:
    name: Mock slave (profibus-mock-slave)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profibus-mock-slave
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -v

      - name: Tests with the lowest direct dependencies
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest" --resolution lowest-direct -e . --group dev
          uv pip list --python "$RUNNER_TEMP/lowest"
          "$RUNNER_TEMP/lowest/bin/python" -m pytest -q

      - name: Console entry point
        run: uv run --no-sync profibus-mock-slave --help

  packages:
    name: Installed wheel and npm contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; same pin as release
        with:
          node-version: '22'
      - run: python scripts/verify_contract.py
      - run: python scripts/prepare_npm.py
      - run: npm --prefix npm test
      - run: npm pack --ignore-scripts
        working-directory: npm
      - run: python scripts/smoke_packages.py python
      - run: python scripts/smoke_packages.py npm
      - run: uvx twine check --strict dist/*
