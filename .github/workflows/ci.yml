name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything here runs without PROFIBUS hardware: the server is started with
# PROFIBUS_MOCK=true (no serial port is opened) and the mock slave is started
# in-process on a free local port.
jobs:
  server:
    name: MCP server (profibus-python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profibus-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q src

      - name: Import package
        run: uv run --no-sync python -c "import profibus_mcp, profibus_mcp.cli, profibus_mcp.server, profibus_mcp.tools, profibus_mcp.pb_master, profibus_mcp.gsd_parser"

      # A real MCP session over stdio: initialize, tools/list, and one
      # read-only tool call. PROFIBUS_MOCK=true means no serial port is needed.
      - name: MCP handshake over stdio (PROFIBUS_MOCK=true)
        run: |
          uv run --no-sync python - <<'EOF'
          import json
          import sys

          import anyio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          EXPECTED = {
              "scan_bus", "read_inputs", "write_outputs", "read_diagnosis",
              "load_gsd_file", "list_slaves", "read_slave_by_alias",
              "write_slave_by_alias", "ping", "get_master_status",
              "test_slave_communication",
          }

          async def main() -> None:
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "profibus_mcp.cli"],
                  env={"PROFIBUS_MOCK": "true"},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      init = await session.initialize()
                      print("initialize:", init.serverInfo.name)
                      names = {tool.name for tool in (await session.list_tools()).tools}
                      print("tools/list:", sorted(names))
                      assert names == EXPECTED, f"unexpected tool set: {sorted(names ^ EXPECTED)}"
                      result = await session.call_tool("ping", {})
                      assert not result.isError, result
                      envelope = json.loads(result.content[0].text)
                      print("ping:", envelope)
                      assert envelope["success"] is True, envelope

          anyio.run(main)
          EOF

  mock:
    name: Mock slave (profibus-mock-slave)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profibus-mock-slave
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q profibus_mock_slave.py

      - name: Import module
        run: uv run --no-sync python -c "import profibus_mock_slave"

      - name: Console entry point
        run: uv run --no-sync profibus-mock-slave --help

      # Starts the mock in-process on a free local port and drives its
      # TCP JSON-lines protocol: scan, read_inputs, diagnosis.
      - name: JSON protocol round trip
        run: |
          uv run --no-sync python - <<'EOF'
          import asyncio
          import json
          import socket

          from profibus_mock_slave import MockConfig, ProfibusMockServer

          def free_port() -> int:
              with socket.socket() as s:
                  s.bind(("127.0.0.1", 0))
                  return s.getsockname()[1]

          async def main() -> None:
              port = free_port()
              server = ProfibusMockServer(MockConfig(host="127.0.0.1", port=port))
              await server.start()
              reader, writer = await asyncio.open_connection("127.0.0.1", port)

              async def ask(request):
                  writer.write(json.dumps(request).encode() + b"\n")
                  await writer.drain()
                  return json.loads(await asyncio.wait_for(reader.readline(), 10))

              try:
                  scan = await ask({"op": "scan"})
                  print("scan:", scan)
                  assert scan["success"], scan
                  assert sorted(s["address"] for s in scan["data"]) == [5, 8], scan

                  inputs = await ask({"op": "read_inputs", "address": 5, "length": 4})
                  print("read_inputs:", inputs)
                  assert inputs["success"], inputs
                  assert len(bytes.fromhex(inputs["data"]["raw_data_hex"])) == 4, inputs

                  diag = await ask({"op": "diagnosis", "address": 5})
                  print("diagnosis:", diag)
                  assert diag["success"] and diag["data"]["status"] == "OK", diag

                  missing = await ask({"op": "diagnosis", "address": 99})
                  print("diagnosis (unknown slave):", missing)
                  assert missing["success"] is False, missing
              finally:
                  writer.close()
                  await writer.wait_closed()
                  await server.stop()

          asyncio.run(main())
          EOF
